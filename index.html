<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsip BPN</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2272%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22>A</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bpn: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 font-[Inter]">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="hidden min-h-screen bg-gradient-to-br from-bpn-800 via-bpn-900 to-slate-900 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-white/10 backdrop-blur border border-white/20 mb-4 shadow-2xl">
          <i class="fas fa-landmark text-4xl text-white"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-white tracking-tight">Arsip BPN</h1>
        <p class="text-bpn-200 mt-2 text-sm">Arsip Digital &amp; Tata Naskah Kantor Pertanahan</p>
      </div>
      <div class="bg-white rounded-2xl shadow-2xl p-8">
        <div id="login-error" class="hidden mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm flex items-center gap-2">
          <i class="fas fa-exclamation-circle"></i><span id="login-error-text"></span>
        </div>
        <h2 class="text-xl font-bold text-slate-800 mb-1">Selamat Datang</h2>
        <p class="text-sm text-slate-500 mb-6">Silakan masuk dengan akun Anda</p>
        <form onsubmit="App.login(); return false;">
          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-600 mb-1.5">Username</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-4 flex items-center text-slate-400"><i class="fas fa-user"></i></span>
              <input id="login-username" type="text" required placeholder="Masukkan username"
                class="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-bpn-500 focus:border-bpn-500 outline-none">
            </div>
          </div>
          <div class="mb-6">
            <label class="block text-sm font-medium text-slate-600 mb-1.5">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-4 flex items-center text-slate-400"><i class="fas fa-lock"></i></span>
              <input id="login-password" type="password" required placeholder="Masukkan password"
                class="w-full pl-11 pr-12 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-bpn-500 focus:border-bpn-500 outline-none">
              <button type="button" onclick="App.togglePassword()" class="absolute inset-y-0 right-4 flex items-center text-slate-400 hover:text-slate-600">
                <i id="login-eye" class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="w-full bg-bpn-600 hover:bg-bpn-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-bpn-600/25">
            <i class="fas fa-sign-in-alt mr-2"></i> Masuk
          </button>
        </form>
        <div class="mt-6 pt-6 border-t border-slate-100">
          <p class="text-xs text-slate-400 text-center">
            Akun default: <span class="font-mono font-medium text-slate-600">admin/admin123</span>
          </p>
        </div>
      </div>
      <p class="text-center text-bpn-300 text-xs mt-8">&copy; <span id="login-year"></span> Badan Pertanahan Nasional</p>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="app-shell" class="hidden">
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-gradient-to-b from-slate-900 to-slate-800 text-white z-40 transition-all duration-300 flex flex-col">
      <div class="flex items-center gap-3 px-5 py-5 border-b border-white/10">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-bpn-500 to-bpn-700 flex items-center justify-center shadow-lg shadow-bpn-900/50 shrink-0">
          <i class="fas fa-landmark text-white text-xl"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-bold text-sm leading-tight truncate">Arsip BPN</h1>
          <p class="text-[11px] text-slate-400 truncate">Arsip Digital Pertanahan</p>
        </div>
      </div>
      <nav id="sidebar-nav" class="flex-1 overflow-y-auto py-4 sidebar-scroll"></nav>
      <div class="p-4 border-t border-white/10">
        <div class="flex items-center gap-3">
          <div id="side-avatar" class="w-9 h-9 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-sm font-bold text-white shrink-0"></div>
          <div class="min-w-0 flex-1">
            <p id="side-name" class="text-sm font-medium truncate"></p>
            <p id="side-role" class="text-[11px] text-slate-400 truncate"></p>
          </div>
          <button onclick="App.logout()" title="Keluar" class="text-slate-400 hover:text-red-400 transition p-2">
            <i class="fas fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </aside>

    <header class="fixed top-0 left-0 right-0 z-30 h-16 bg-white/90 backdrop-blur border-b border-slate-200 flex items-center justify-between px-4 lg:pl-72 pr-4">
      <div class="flex items-center gap-3">
        <button id="sidebarToggle" class="lg:hidden p-2 text-slate-500 hover:bg-slate-100 rounded-lg"><i class="fas fa-bars"></i></button>
        <div>
          <p class="text-sm font-semibold text-slate-800 text-[15px]" id="header-flex">Dashboard</p>
          <p class="text-[11px] text-slate-400 capitalize" id="header-month"></p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="hidden sm:inline-flex text-[11px] font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full">
          <i class="fas fa-circle-dot mr-1.5 text-[8px] mt-0.5"></i>Online · Data Tersimpan
        </span>
        <a href="#/profil" class="w-9 h-9 rounded-full bg-gradient-to-br from-bpn-500 to-bpn-700 flex items-center justify-center text-sm font-bold text-white" id="header-avatar"></a>
      </div>
    </header>

    <main class="lg:ml-64 pt-16 px-6 pb-8">
      <div id="flash-message" class="hidden mb-4 px-4 py-2.5 rounded-xl text-sm font-medium"></div>
      <div id="app-content"></div>
    </main>
  </div>

  <!-- MODAL & TOAST -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div id="modal-box" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto"></div>
  </div>
  <div id="toast" class="hidden fixed bottom-5 right-5 z-[60] px-5 py-3.5 rounded-xl shadow-xl text-sm font-medium"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views.js"></script>
</body>
</html>
